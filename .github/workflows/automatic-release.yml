name: Automatic Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example: v3.3.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Prepare release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}".Trim()

          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid release tag '$tag'. Use a tag such as v3.3.0 or v3.3.0-beta.1."
            exit 1
          }

          git fetch --tags --force origin

          $existing = git ls-remote --tags origin "refs/tags/$tag" 2>$null
          if ($existing) {
            Write-Host "Tag $tag already exists. Building that exact tag."
            git checkout --detach "refs/tags/$tag"
          } else {
            Write-Host "Tag $tag does not exist. Creating it from current master."
            git tag -a $tag -m "MyAmneziaWG $tag"
            git push origin "refs/tags/$tag"
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release tag: $tag"
          Write-Host "Commit: $(git rev-parse HEAD)"

      - name: Build application
        run: build7.bat
        shell: cmd

      - name: Build installers
        run: installer/build7.bat
        shell: cmd

      - name: Verify MSI files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path installer/dist -Filter *.msi -File
          if ($files.Count -eq 0) {
            Write-Error 'No MSI files were produced.'
            exit 1
          }
          $files | ForEach-Object { Write-Host "MSI: $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAmneziaWG-installers
          path: installer/dist/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MyAmneziaWG ${{ env.RELEASE_TAG }}
          files: installer/dist/*.msi
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
          draft: false
          prerelease: false
